<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        #categories div{
            display:flex;
            justify-content: center;
            background-color: rgb(31, 7, 245);
            border: 1px dashed gray;
            border-radius: 15px;
            min-width: 100px;
            min-height: 100px;
            width:auto;
            gap: 10px;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        padding :10px;
        color:white;
        margin-bottom: 10px;


        }
    </style>
</head>
<body>
    <div id='categories'>
        <div>loading....</div>
    </div>
         <button id="button">click me to fetch data</button>
    <script>
        const categories = document.getElementById('categories');
        const button= document.getElementById('button');
        button.addEventListener('click', ()=>{
          //  categories.innerHTML= '<div>Jonathan</div><div>Felix</div><div>Anita</div>';
            getCategories();
        });
        function getCategories(){
            fetch('https://jsonplaceholder.typicode.com/posts')
       .then(response => response.json())
       .then(posts => {
        let allposts='';
            posts.forEach(u =>{allposts += '<div>'+u.title +  '</div>'});
            categories.innerHTML = allposts;
       })
       .catch(error => alert(error))
        }
    </script>
</body>
</html>
